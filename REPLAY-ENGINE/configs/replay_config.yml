redis:
  host: universal-logging-redis
  port: 6379
  url: redis://universal-logging-redis:6379
  stream_key: nginx-log-stream
  consumer_group: replay_group
  consumer_name: replayer-1
stream:
  key: nginx-log-stream
  group: replay_group
  consumer: replayer-1
replay:
  max_events_per_batch: 100
  checkpoint_every: 50
  default_speed: 1.0
bug_detection:
  error_levels:
    - ERROR
    - FATAL
    - CRITICAL
  gap_threshold_seconds: 300
  correlation_timeout_hours: 1
  repeated_error_threshold: 3
