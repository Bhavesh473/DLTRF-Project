---
# =============================================================================
#  DLTRF - Ansible Deployment Playbook
#  File: ansible/deploy.yml
# =============================================================================
#
#  Mirrors the full logic of dltrf-cloud.ps1, covering:
#    1. Prerequisites  — Ensure Docker & Docker Compose are installed
#    2. Code Sync      — Pull latest code from main branch
#    3. Hook Deploy    — Build & start universal-logging-hook-microservice
#    4. Engine Deploy  — Build & start REPLAY-ENGINE
#    5. Cleanup        — Prune unused Docker images
#
#  Run from WSL:
#    ansible-playbook -i ansible/inventory.ini ansible/deploy.yml
#
#  NOTE: Uses ansible.builtin.shell for Docker steps (not community.docker)
#        to avoid Python SDK dependency errors on the remote VM.
# =============================================================================



- name: Deploy DLTRF to Azure VM
  hosts: dltrf_servers
  become: true   # Run tasks as sudo/root where needed

  # ---------------------------------------------------------------------------
  #  Variables — single place to update paths/settings
  # ---------------------------------------------------------------------------
  vars:
    project_root: "/home/azureuser/DLTRF-Project"
    hook_dir:     "/home/azureuser/DLTRF-Project/universal-logging-hook-microservice"
    engine_dir:   "/home/azureuser/DLTRF-Project/REPLAY-ENGINE"
    git_branch:   "main"

  tasks:

    # -------------------------------------------------------------------------
    #  PHASE 1: Prerequisites — Docker & Docker Compose
    # -------------------------------------------------------------------------

    - name: "[1/6] Install Docker, Docker Compose plugin, Git, and Curl"
      apt:
        name:
          - docker.io
          - docker-compose-plugin   # Provides 'docker compose' (v2) sub-command
          - git
          - curl
        state: present
        update_cache: yes

    - name: "[1/6] Ensure Docker service is started and enabled on boot"
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: "[1/6] Add azureuser to the docker group (no sudo needed for docker)"
      user:
        name: azureuser
        groups: docker
        append: yes

    # -------------------------------------------------------------------------
    #  PHASE 2: Code Sync — Git Pull
    # -------------------------------------------------------------------------

    - name: "[2/6] Force pull latest code (Reset strictly to GitHub)"
      ansible.builtin.shell: |
        git fetch --all
        git reset --hard origin/{{ git_branch }}
      args:
        chdir: "{{ project_root }}"
      become: false
      register: git_pull_output
      changed_when: "'Already up to date.' not in git_pull_output.stdout"

    - name: "[2/6] Show Git pull result"
      debug:
        var: git_pull_output.stdout

    # -------------------------------------------------------------------------
    #  PHASE 3: Deploy Hook Environment (Nginx, Juice Shop, Redis, Fluentd)
    # -------------------------------------------------------------------------

    - name: "[3/6] Build & start Hook Microservice (Nuke and Rebuild)"
      ansible.builtin.shell: |
        docker compose down
        docker compose build --no-cache
        docker compose up --force-recreate -d
      args:
        chdir: "{{ hook_dir }}"
      register: hook_output

    - name: "[3/6] Show Hook deployment result"
      debug:
        var: hook_output.stdout_lines

    # -------------------------------------------------------------------------
    #  PHASE 4: Deploy Replay Engine (Python FastAPI)
    # -------------------------------------------------------------------------

    - name: "[4/6] Build & start REPLAY-ENGINE (docker compose up --build -d)"
      ansible.builtin.shell: "docker compose up --build -d"
      args:
        chdir: "{{ engine_dir }}"
      register: engine_output

    - name: "[4/6] Show Engine deployment result"
      debug:
        var: engine_output.stdout_lines

    # -------------------------------------------------------------------------
    #  PHASE 5: Health Check — Confirm containers are actually running
    # -------------------------------------------------------------------------

    - name: "[5/6] Verify all containers are running"
      ansible.builtin.shell: "docker ps --format 'table {% raw %}{{.Names}}\t{{.Status}}\t{{.Ports}}{% endraw %}'"
      register: running_containers

    - name: "[5/6] Show running containers"
      debug:
        var: running_containers.stdout_lines

    # -------------------------------------------------------------------------
    #  PHASE 6: Cleanup — Docker System Prune
    #  NOTE: 'docker system prune -f' only removes UNUSED objects.
    #        Running containers and their volumes are always safe.
    # -------------------------------------------------------------------------

    - name: "[6/6] Prune unused Docker images, containers, and networks"
      ansible.builtin.shell: "docker system prune -f"
      register: prune_output

    - name: "[6/6] Show prune result"
      debug:
        var: prune_output.stdout_lines

    # -------------------------------------------------------------------------
    #  Summary — Print access URLs after successful deployment
    # -------------------------------------------------------------------------

    - name: "Deployment Complete — Access URLs"
      debug:
        msg:
          - "============================================"
          - " DLTRF Deployment Successful via Ansible!"
          - "============================================"
          - " Webapp (via Nginx) :  http://20.212.82.99"
          - " Log Dashboard      :  http://20.212.82.99:5000"
          - " Replay Engine API  :  http://20.212.82.99:8000"
          - " HTML Report        :  http://20.212.82.99:8000/report"
          - "============================================"
# Force Docker Rebuild Trigger
