# ── Global noise — universal HTTP status transitions ──────────────────────────
global_noise:
  status_transitions:

    - from: 304
      to: 200
      reason: >
        Browser returned a cached response (304 Not Modified) during recording.
        Replay has no browser cache, so the server sends the full resource (200 OK).
        This is RFC 7234 cache behaviour, not a bug.
      recommendation: "Not a bug. Automatically excluded from reproducibility rate."

    - from: 304
      to: 401
      reason: >
        The request was served from browser cache during recording (304).
        By replay time the auth token or session has expired, so the server
        rejects the real request with 401 Unauthorized.
      recommendation: >
        Re-record a fresh session, or ensure authentication warmup
        runs successfully before replay starts.

    - from: 200
      to: 429
      reason: >
        Replay fires requests faster than a human browser. The app's rate
        limiter triggered and returned 429 Too Many Requests.
      recommendation: >
        Reduce replay concurrency or add inter-request delay in your
        replay configuration.

    - from: 302
      to: 419
      reason: >
        CSRF token mismatch. The app rejected the replayed CSRF token because
        CSRF tokens are single-use. This is expected behaviour in Laravel,
        Rails, Django, and any app using the Synchroniser Token Pattern.
      recommendation: >
        Ensure the target app stores sessions in a persistent database that
        is restored by your checkpoint script. For Laravel, set
        SESSION_DRIVER=database. The 419 itself is correct — the app is
        protecting against replay attacks, which is exactly what DLTRF does.

    - from: 200
      to: 419
      reason: >
        CSRF token mismatch on a non-redirect endpoint. The CSRF token from
        recording is no longer valid at replay time — single-use by design.
      recommendation: >
        This is expected Laravel/Rails/Django behaviour. Not a bug.

    - from: 302
      to: 302
      reason: >
        Standard POST/Redirect/GET pattern. A form POST redirects on both
        the original recording and the replay. Destination may differ due
        to session state, but the redirect mechanism itself is correct.
      recommendation: "Not a bug. The redirect pattern is working as designed."


