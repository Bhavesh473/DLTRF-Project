# ─────────────────────────────────────────────────────────────────────────────
# CUSTOM RULES (BookStack Profile)
#
# KEY DESIGN PRINCIPLE:
#   A rule with tier: EXPECTED means "we understand why this happened,
#   it is not a bug, exclude it from the repro rate."
#
#   A rule with tier: INVESTIGATE means "we understand the cause but a
#   human should verify it before promoting."
#
#   Items with NO matching rule that still diverge → CRITICAL (genuine bugs).
#   The verdict logic in report_generator.py only counts items where
#   rule_id == "no_match" as genuine bugs for the FAIL verdict.
#   Everything else — even if visually shown as CRITICAL tier — is classified
#   and explained, so the developer knows exactly what happened.
# ─────────────────────────────────────────────────────────────────────────────

custom_rules:

  # ── 1. Webhook CRUD state drift ───────────────────────────────────────────
  # When a webhook is created and then deleted within the same recorded session,
  # replay cannot find it (it was deleted before replay ran). The 404 is correct
  # behaviour from BookStack. This is a recording hygiene issue, not a bug.
  - id: "bookstack-webhook-state-drift"
    label: "Webhook CRUD State Drift"
    tier: EXPECTED
    match:
      path_patterns:
        - "/settings/webhooks*"
      replay_statuses: [404]
    reason: >
      STATE DRIFT: This 404 occurred because the webhook was created and then
      deleted within the same recorded session. On replay the database is
      restored to the pre-recording checkpoint, so the webhook does not exist.
      BookStack is behaving correctly — this is a recording hygiene issue.
    recommendation: >
      Do not create and delete resources within the same recording session if
      you want replay to reproduce those requests. Record a session where the
      webhook already exists, or restore a checkpoint that includes the webhook.

  # ── 2. BookStack dynamic URL slugs ───────────────────────────────────────
  # BookStack appends random short suffixes to URL slugs to prevent name
  # collisions (e.g. /shelves/my-shelf-aBc). If the slug suffix differs
  # between recording and replay (because the DB was reset), the GET returns
  # 404. This is expected state drift, not a BookStack bug.
  - id: "bookstack-dynamic-slugs"
    label: "Dynamic URL Slug Mismatch"
    tier: EXPECTED
    match:
      path_patterns:
        - "/shelves/*"
        - "/books/*"
        - "/books/*/chapters/*"
        - "/books/*/pages/*"
      methods: [GET]
      replay_statuses: [404]
    reason: >
      BookStack generates random slug suffixes (e.g. "-iAr") to prevent name
      collisions. After a DB reset and re-seed the suffixes differ from the
      recorded session, so the exact URL path no longer exists. The app is
      behaving correctly.
    recommendation: >
      Expected behaviour after a DB reset. Use the checkpoint/restore workflow
      to preserve slug state between recording and replay. Not a BookStack bug.

  # ── 3. Profile / settings auth cascade ───────────────────────────────────
  # If the replay login POST fails or the session is lost mid-replay,
  # subsequent authenticated pages redirect to /login instead of rendering.
  # This cascades from the first auth failure, not from individual page bugs.
  - id: "bookstack-auth-cascade-redirect"
    label: "Auth Cascade — Redirected to Login"
    tier: INVESTIGATE
    match:
      path_patterns:
        - "/my-account/*"
        - "/settings/*"
        - "/shelves*"
        - "/books*"
        - "/pages*"
      original_statuses: [200]
      replay_statuses: [302]
    reason: >
      This page redirected to login during replay. This is almost always caused
      by an earlier authentication failure — once the session is lost, all
      protected pages cascade to 302 redirects. The page itself is not buggy.
    recommendation: >
      Check the POST /login event in this report. If it shows 302 (success),
      the session was established correctly and this redirect is unexpected —
      investigate session persistence. If POST /login shows 419 or 500, fix
      the login step first and all cascades will resolve.

  # ── 4. Static asset 304→404 ───────────────────────────────────────────────
  # After a DB/volume reset, uploaded images and user avatars no longer exist
  # on disk. A browser cache hit (304) during recording becomes a real 404
  # on replay because the file was wiped with the volume reset.
  - id: "bookstack-static-asset-missing-after-reset"
    label: "Static Asset Missing After Volume Reset"
    tier: EXPECTED
    match:
      path_patterns:
        - "/uploads/*"
      original_statuses: [304, 200]
      replay_statuses: [404]
    reason: >
      Uploaded files (avatars, cover images, attachments) are stored on the
      BookStack volume. After a factory reset (docker compose down -v), the
      volume is wiped so the files no longer exist. The 404 is correct — the
      file is genuinely gone in the replay environment.
    recommendation: >
      Not a BookStack bug. If you need uploaded files to persist across resets,
      back up the bookstack-app-data volume before resetting, or use a fixture
      seeder to restore them. Excluded from reproducibility rate.

  # ── 5. Logout CSRF mismatch ───────────────────────────────────────────────
  # POST /logout requires a CSRF token. By the time replay reaches logout,
  # the session has already been modified by replayed requests, so the token
  # from the recording is stale. This is expected single-use token behaviour.
  - id: "bookstack-logout-csrf"
    label: "Logout CSRF Token Stale"
    tier: EXPECTED
    match:
      path_patterns:
        - "/logout"
      methods: [POST]
      replay_statuses: [419]
    reason: >
      POST /logout requires a valid CSRF token. By the time replay reaches the
      logout request, the session state has changed (previous replayed POSTs
      rotated the token). Laravel correctly rejects the stale token with 419.
      This is single-use CSRF token behaviour, not a bug.
    recommendation: >
      Expected behaviour. The CSRF refresher scrapes a live token before each
      POST, but the logout token may have been rotated by a preceding request
      in the same replay batch. Not a BookStack bug.


