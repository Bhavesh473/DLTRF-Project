# divergence_config.yaml — DLTRF App-Agnostic Base Profile
# ─────────────────────────────────────────────────────────────────────────────
# This file is the single source of truth for ALL divergence classification.
# report_generator.py contains zero app-specific logic — it only renders what
# this file decides.
#
# Hot-reload without a full rebuild:
#   docker cp divergence_config.yaml replay-engine:/app/divergence_config.yaml
#   docker restart replay-engine
#
# CLASSIFICATION TIERS (in order of precedence):
#   EXPECTED   — known noise, excluded from repro rate, no action needed
#   INVESTIGATE — diverged but explainable; review before promoting
#   CRITICAL   — genuine non-determinism with NO matching rule; do not ship
#
# RULE EVALUATION ORDER:
#   1. custom_rules (top-to-bottom, first match wins)
#   2. global_noise.status_transitions
#   3. Engine's original tier (fallback — only hits if NO rule matched)
# ─────────────────────────────────────────────────────────────────────────────

# ── App metadata (optional — shown in report header) ─────────────────────────
app:
  name: "BookStack"
  description: "Laravel-based documentation wiki. Sessions stored in MySQL."
  auth_mode_hint: "cookie"


# ── Auth expiry hours ─────────────────────────────────────────────────────────
jwt_expiry_hours: 12


# ── Auth notes — shown in the report banner, per auth mode ───────────────────
auth_notes:
  jwt:
    title: "⏱ JWT expiry"
    body: >
      <strong>Tokens expire after 12 hours.</strong>
      If you're seeing 401s in INVESTIGATE and the app was fine before,
      just re-record — don't waste time debugging.
      The token comes from <code>auth_header</code> in nginx logs.

  cookie:
    title: "⏱ Session expiry"
    body: >
      <strong>Session cookies expire after ~12 hours.</strong>
      If you're seeing 419s (CSRF mismatch) or 401/403s in INVESTIGATE
      and the app was fine before, re-record a fresh session.
      The cookie comes from <code>cookie_header</code> in nginx logs.
      Ensure your app stores sessions in a persistent database that is
      restored by your checkpoint script — not in flat files or memory.

  none:
    title: "⏱ Auth note"
    body: >
      <strong>No auth was detected in this recording.</strong>
      If you expected authenticated requests, check that your app sends
      either a Bearer token (<code>Authorization</code> header) or
      session cookies (<code>Cookie</code> header).
      Nginx must log <code>$http_authorization</code> and <code>$http_cookie</code>.


